
services:
  gateway:
    build: ./services/gateway
    restart: unless-stopped
    ipc: host
    env_file: ./services/gateway/.env
    environment:
      LOCAL_IP: ${LOCAL_IP}
    ports:
      - "5004:5004/udp"
      - "9100:9100/udp"
      - "9101:9101/udp"
      - "9102:9102/udp"
    volumes:
      - ./services/gateway:/app
    command: ["python","app/run_gateway.py"]

  gcs:
    build: ./services/gcs
    restart: unless-stopped
    ipc: host
    env_file: ./services/gcs/.env      
    environment:
      LOCAL_IP: ${LOCAL_IP}
      HTTP_PUBLIC_HOST: 127.0.0.1
      HTTP_PUBLIC_VIDEO_PORT: 8000
      HTTP_PUBLIC_CONTROL_PORT: 8100
    ports:
      - "8000:8000"
      - "8100:8100"
      - "8081:8081"
    volumes:
      - ./services/gcs/app:/app
      - ./services/gcs/code:/app/code
      - ./services/gcs/static:/app/static
    command: ["python","run_gcs.py"]

  imu_dash:
    build: ./services/imu_dash
    restart: unless-stopped
    ipc: host
    env_file: ./services/imu_dash/.env
    environment:
      LOCAL_IP: ${LOCAL_IP}
    ports:
      - "8200:8200"
      - "8201:8201"
    volumes:
      - ./services/imu_dash/app:/app
      - ./services/imu_dash/code:/app/code
    command: ["python","run_imu_dash.py"]
