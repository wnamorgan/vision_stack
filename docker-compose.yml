networks:
  vision:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1

  macvlan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT}
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

services:
  camera:
    build:
      context: ./services/camera
    env_file: ./services/camera/.env
    volumes:
      - ./services/camera:/app
    ipc: host
    devices:
      - "${CAM_DEVICE}:${CAM_DEVICE}"
    networks:
      - vision

  gateway:
    build:
      context: ./services/gateway
    env_file: ./services/gateway/.env
    volumes:
      - ./services/gateway:/app
    environment:
      ZMQ_SUB_ENDPOINT: tcp://camera:5555
    depends_on:
      - camera
    ipc: host
    networks:
      vision: {}
      macvlan:
        ipv4_address: 192.168.1.50
    ports:
      # keep only if you need gateway's web UI from the host
      - "8082:80/tcp"

  gcs:
    build:
      context: ./services/gcs
    restart: unless-stopped
    volumes:
      - ./services/gcs/app:/app
      - ./services/gcs/code:/app/code
      - ./services/gcs/static:/app/static
    environment:  
      STATIC_DIR: /app/static      
      PUBLIC_HOST: 127.0.0.1
      VIDEO_PUBLIC_PORT: 18000
      CONTROL_API_PUBLIC_PORT: 18100
      UDP_DST_IP: gateway
    env_file:
      - ./services/gcs/.env
    networks:
      - vision
    ports:
      # publish these so the host can reach the GCS web services
      # (use non-conflicting host ports; your host already has something on 8081)
      - "18000:8000/tcp"  # VIDEO_HTTP_PORT
      - "18100:8100/tcp"  # CONTROL_API_PORT
      - "18081:8081/tcp"  # DASH_PORT


