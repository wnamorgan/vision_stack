networks:
  vision:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1

  macvlan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT}
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

services:
  camera:
    build:
      context: ./services/camera
    environment:
      USE_ARAVIS: 1
    env_file: ./services/camera/.env
    volumes:
      - ./services/camera:/app
      - /dev:/dev
      - /sys/bus/usb:/sys/bus/usb
    ipc: host
    privileged: true
    networks:
      - vision

  imu:
    build:
      context: ./services/imu
    env_file: ./services/imu/.env
    volumes:
      - ./services/imu:/app
      - /dev:/dev
    ipc: host
    privileged: true
    networks:
      - vision

  tracker:
    build:
      context: ./services/tracker
      args:
        BASE_IMAGE: ${TRACKER_BASE_IMAGE:-ultralytics/ultralytics:latest-jetson-jetpack6}
    image: vision_stack-tracker:${TRACKER_TAG:-unknown}
    env_file: ./services/tracker/.env
    ipc: host
    gpus: all
    environment:
      ZMQ_CONNECT_SUB_CAMERA_HOST: camera
      ZMQ_CONNECT_SUB_CAMERA_PORT: 5555
    volumes:
      - ./services/tracker:/app
      - ./calibration.json:/app/calibration.json:ro
    depends_on:
      - camera
    networks:
      - vision

  gateway:
    build:
      context: ./services/gateway
    env_file: ./services/gateway/.env
    volumes:
      - ./services/gateway:/app
    environment:
      ZMQ_CONNECT_SUB_CAMERA_HOST: camera
      ZMQ_CONNECT_SUB_CAMERA_PORT: 5555
      ZMQ_CONNECT_SUB_IMU_HOST: imu
      ZMQ_CONNECT_SUB_IMU_PORT: 5530
    depends_on:
      - camera
      - imu
    ipc: host
    networks:
      vision: {}
      macvlan:
        ipv4_address: 192.168.1.50
    ports:
      # keep only if you need gateway's web UI from the host
      - "8082:80/tcp"
